services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: sih26127-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: sih26127
      POSTGRES_USER: sih26127
      POSTGRES_PASSWORD: sih26127
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sih26127 -d sih26127"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
